name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build Stockfish for Android (arm64)
        run: |
          export NDK=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}
          export PATH=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          git clone --depth 1 --branch sf_17 https://github.com/official-stockfish/Stockfish.git
          cd Stockfish/src
          make -j4 build ARCH=armv8-dotprod COMP=ndk
          mkdir -p ../../app/src/main/jniLibs/arm64-v8a
          llvm-strip stockfish -o ../../app/src/main/jniLibs/arm64-v8a/libstockfish.so
          ls -l ../../app/src/main/jniLibs/arm64-v8a/
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: chessbuddy-apk
          path: app/build/outputs/apk/debug/app-debug.apk
